<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3c4a"/>
      <stop offset=".45" stop-color="#4f7a82"/>
      <stop offset=".72" stop-color="#c9a585"/>
      <stop offset=".86" stop-color="#e8b27a"/>
      <stop offset="1" stop-color="#f0c48c"/>
    </linearGradient>
    <radialGradient id="sun" cx=".64" cy=".62" r=".35">
      <stop offset="0" stop-color="#ffe2b0" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#f6c07e" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f6c07e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a88a73"/>
      <stop offset=".25" stop-color="#4c6a70"/>
      <stop offset="1" stop-color="#10272e"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d8790"/>
      <stop offset="1" stop-color="#8a9a97"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34525a"/>
      <stop offset="1" stop-color="#4a6164"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17313a"/>
      <stop offset="1" stop-color="#0e232a"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>
  <rect width="1200" height="400" fill="url(#sun)"/>

  <!-- soft clouds -->
  <g fill="#f3d6b4" opacity=".35" filter="url(#blur)">
    <ellipse cx="300" cy="120" rx="170" ry="16"/>
    <ellipse cx="820" cy="95" rx="210" ry="14"/>
    <ellipse cx="1040" cy="150" rx="140" ry="12"/>
    <ellipse cx="560" cy="170" rx="120" ry="10"/>
  </g>
  <g fill="#1f3f4b" opacity=".35" filter="url(#blur)">
    <ellipse cx="180" cy="60" rx="220" ry="22"/>
    <ellipse cx="960" cy="40" rx="260" ry="24"/>
  </g>

  <!-- far ridge -->
  <path fill="url(#far)" opacity=".9" d="M0 238 L70 205 L130 214 L210 168 L270 190 L340 150 L400 178 L470 160 L520 186 L600 172 L680 196 L760 158 L820 176 L880 140 L950 182 L1030 166 L1100 194 L1200 176 L1200 262 L0 262 Z"/>
  <!-- snow tips -->
  <path fill="#e9ddd0" opacity=".45" d="M340 150 L356 160 L348 161 L340 156 L331 162 L326 158 Z M880 140 L898 152 L889 152 L880 147 L870 154 L866 150 Z M210 168 L224 177 L216 177 L208 173 L201 178 Z"/>

  <!-- mid mountains -->
  <path fill="url(#mid)" d="M0 262 L60 232 L120 244 L190 200 L250 222 L300 206 L380 238 L430 226 L500 252 L1200 252 L1200 214 L1140 196 L1080 214 L1010 186 L950 208 L880 230 L820 250 L0 270 Z"/>

  <!-- loch -->
  <rect y="258" width="1200" height="142" fill="url(#loch)"/>
  <!-- reflections -->
  <g opacity=".22">
    <path fill="#34525a" d="M0 262 L60 290 L120 280 L190 322 L250 300 L300 316 L380 284 L430 296 L500 270 L0 270 Z"/>
    <path fill="#34525a" d="M1200 262 L1140 304 L1080 286 L1010 316 L950 294 L880 272 L1200 272 Z"/>
  </g>
  <!-- sun glitter on water -->
  <g fill="#ffd9a3" opacity=".55">
    <rect x="700" y="266" width="120" height="2" rx="1"/>
    <rect x="730" y="276" width="80" height="2" rx="1"/>
    <rect x="745" y="288" width="56" height="1.6" rx=".8"/>
    <rect x="712" y="300" width="94" height="1.4" rx=".7"/>
    <rect x="752" y="314" width="40" height="1.2" rx=".6"/>
    <rect x="735" y="330" width="60" height="1" rx=".5"/>
  </g>
  <g stroke="#dfe8e6" stroke-opacity=".12" stroke-width="1">
    <path d="M40 300 H220 M300 332 H520 M880 318 H1100 M140 362 H380 M620 356 H820 M960 378 H1160"/>
  </g>

  <!-- near headland left -->
  <path fill="url(#near)" d="M0 250 C60 236 110 246 160 262 C220 282 260 300 300 400 L0 400 Z"/>
  <!-- near headland right with pines -->
  <path fill="url(#near)" d="M1200 236 C1130 238 1060 262 1000 292 C960 312 930 350 900 400 L1200 400 Z"/>
  <g fill="#0b1e24">
    <path d="M1010 290 l9 -34 l9 34 z M1026 286 l7 -26 l7 26 z"/>
    <path d="M1045 278 l11 -44 l11 44 z M1064 272 l9 -36 l9 36 z"/>
    <path d="M1082 266 l12 -50 l12 50 z M1102 262 l10 -40 l10 40 z"/>
    <path d="M1120 256 l13 -56 l13 56 z M1142 252 l10 -42 l10 42 z"/>
    <path d="M1160 248 l12 -52 l12 52 z M1180 244 l10 -44 l10 44 z"/>
    <path d="M40 262 l7 -28 l7 28 z M56 258 l9 -36 l9 36 z M76 262 l6 -24 l6 24 z"/>
    <path d="M96 266 l8 -32 l8 32 z M114 270 l6 -22 l6 22 z"/>
  </g>
  <!-- tiny boat -->
  <path fill="#0f262d" d="M560 322 h26 l-4 5 h-18 z"/>
  <path fill="#e8d9c4" opacity=".8" d="M572 321 v-14 l9 13 z"/>
</svg>
