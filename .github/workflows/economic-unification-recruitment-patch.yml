name: Apply recruitment economy migration patch

on:
  push:
    branches:
      - 'chatgpt/economic-unification'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[recruitment-economy-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/economic-unification
      - name: Route legacy recruitment helpers through canonical football levels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/game/recruitment.ts')
          text = p.read_text()

          old_import = '''import {
            weeklyWageFor,
            profileForTier,
            tierOfClub,
            tierOfUser,
            sustainableWeeklyWageBill,
          } from "./economy";'''
          new_import = '''import { tierOfClub, tierOfUser, sustainableWeeklyWageBill } from "./economy";
          import { legacyTierToFootballLevel } from "./footballLevel";
          import { recruitmentPlayerValue, recruitmentWageForLevel } from "./recruitmentEconomy";'''
          if text.count(old_import) != 1:
            raise SystemExit(f'expected economy import block once, found {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          old_wage = '''export function wageForAbility(
            ability: number,
            clubRep = 55,
            tier = 1,
            age?: number,
            potential?: number,
          ): number {
            return weeklyWageFor({ ability, tier, clubReputation: clubRep, age, potential });
          }'''
          new_wage = '''/** @deprecated Compatibility boundary: tier is the persisted legacy economic tier. */
          export function wageForAbility(
            ability: number,
            clubRep = 55,
            tier = 1,
            age?: number,
            potential?: number,
          ): number {
            return recruitmentWageForLevel(
              legacyTierToFootballLevel(tier),
              ability,
              clubRep,
              age,
              potential,
            );
          }'''
          if text.count(old_wage) != 1:
            raise SystemExit(f'expected wageForAbility block once, found {text.count(old_wage)}')
          text = text.replace(old_wage, new_wage, 1)

          old_value = '''export function valueForPlayer(ability: number, potential: number, age: number, tier = 1): number {
            const peak = clamp(1.25 - Math.abs(age - 25) * 0.045, 0.35, 1.25);
            const upside = 1 + Math.max(0, potential - ability) / 90;
            const scale = profileForTier(tier).transferMarketScale;
            const raw = ability ** 3 * 0.55 * peak * upside * scale;
            return Math.max(10_000, int(raw / 5_000) * 5_000);
          }'''
          new_value = '''/** @deprecated Compatibility boundary: tier is the persisted legacy economic tier. */
          export function valueForPlayer(ability: number, potential: number, age: number, tier = 1): number {
            return recruitmentPlayerValue(
              ability,
              potential,
              age,
              legacyTierToFootballLevel(tier),
            );
          }'''
          if text.count(old_value) != 1:
            raise SystemExit(f'expected valueForPlayer block once, found {text.count(old_value)}')
          text = text.replace(old_value, new_value, 1)

          p.write_text(text)
          PY
          bunx prettier --write src/lib/game/recruitment.ts
      - name: Commit migration patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/game/recruitment.ts
          git commit -m "Route recruitment helpers through football levels [recruitment-economy-patched]"
          git push origin HEAD:chatgpt/economic-unification
