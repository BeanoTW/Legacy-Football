name: Release soak

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: Full seasons to simulate through normal weekly advancement
        required: true
        default: "15"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
          - "20"
          - "30"
      checkpoint_every:
        description: Save/reload checkpoint cadence in seasons
        required: true
        default: "5"
        type: choice
        options:
          - "1"
          - "5"
          - "10"

jobs:
  release-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Run long-career release soak
        env:
          SOAK_SEASONS: ${{ inputs.seasons }}
          SOAK_CHECKPOINT_EVERY: ${{ inputs.checkpoint_every }}
          SOAK_SEED: RELEASE|SOAK|FIXED
        run: bun src/lib/game/__release__/release-soak.ts
