name: Apply checkpoint test patch

on:
  push:
    branches:
      - 'chatgpt/scalable-world-checkpoint'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[negotiation-levels]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/scalable-world-checkpoint
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Wire canonical negotiation wages
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/game/recruitment.ts')
          text = p.read_text()

          replacements = [
            (
              '''  recruitmentPlayerValue,\n  recruitmentSustainableWageBill,\n  recruitmentWageForClub,''',
              '''  recruitmentPlayerValue,\n  recruitmentSustainableWageBill,\n  recruitmentUserNegotiationWage,\n  recruitmentWageForClub,''',
              'import anchor',
            ),
            (
              '''  const growth = clubGrowthFactor(s);\n  return Math.max(\n    250,\n    int(\n      (p.wageExpectation * roleFactor * personality * facilityFactor * growth) / ambitionGap / 25,\n    ) * 25,\n  );''',
              '''  const growth = clubGrowthFactor(s);\n  const rawDemand =\n    (p.wageExpectation * roleFactor * personality * facilityFactor * growth) / ambitionGap;\n  return recruitmentUserNegotiationWage(s, rawDemand);''',
              'wageDemand block',
            ),
            (
              '''  n.playerCounterWage = int(threshold / 25) * 25;''',
              '''  n.playerCounterWage = recruitmentUserNegotiationWage(s, threshold);''',
              'counter wage block',
            ),
            (
              '''  const uplift = 1 + clamp((p.currentAbility - 55) / 120, 0, 0.5) + rngRange(rng, 0, 0.12);\n  const wage = Math.max(c.weeklyWage, int((wageDemand(s, p, c.squadRole) * uplift) / 25) * 25);''',
              '''  const uplift = 1 + clamp((p.currentAbility - 55) / 120, 0, 0.5) + rngRange(rng, 0, 0.12);\n  const wage = Math.max(\n    c.weeklyWage,\n    recruitmentUserNegotiationWage(s, wageDemand(s, p, c.squadRole) * uplift),\n  );''',
              'renewal wage block',
            ),
          ]

          for old, new, label in replacements:
            if text.count(old) != 1:
              raise SystemExit(f'{label}: expected once, found {text.count(old)}')
            text = text.replace(old, new, 1)

          p.write_text(text)
      - name: Format and verify
        shell: bash
        run: |
          bunx prettier --write src/lib/game/recruitment.ts
          bun src/lib/game/__checks__/recruitment-economy.check.ts
          bun src/lib/game/__checks__/negotiation-wage-economy.check.ts
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/lib/game/recruitment.ts
          git commit -m "Move negotiation wages onto football levels [negotiation-levels]"
          git push origin HEAD:chatgpt/scalable-world-checkpoint
