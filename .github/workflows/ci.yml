name: CI

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore supplied audit for verification
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs"),z=require("node:zlib"),c=require("node:crypto");const b=z.brotliDecompressSync(Buffer.from(fs.readFileSync("scripts/economy-audit.br64","utf8").trim(),"base64"));if(c.createHash("sha256").update(b).digest("hex")!=="a5720df21ee0c2fce0e914394c9f3412a1f33f178c24649db0ed57febe7697b4")throw Error("audit source checksum mismatch");fs.writeFileSync("src/lib/game/__checks__/economy-audit.check.ts",b)'
          base64 -w0 src/lib/game/__checks__/economy-audit.check.ts | fold -w 1600 | awk '{print "AUDIT_BASE64|" NR-1 "|" $0}'
          bun src/lib/game/__checks__/economy-audit.check.ts --seasons=1 --baseline
      - name: Build
        run: bun run build

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  game-checks:
    name: game-checks shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # The long-horizon simulation shards can legitimately exceed 15 minutes on
    # shared GitHub runners. Keep the timeout above their normal worst case so
    # deterministic game checks fail on assertions rather than runner time.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run game verification suites
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          checks=(src/lib/game/__checks__/*.check.ts)
          if [ ${#checks[@]} -eq 0 ]; then
            echo "No game verification suites found."
            exit 1
          fi

          shard=${{ matrix.shard }}
          shard_count=4
          ran=0
          for i in "${!checks[@]}"; do
            if (( i % shard_count != shard )); then
              continue
            fi
            check="${checks[$i]}"
            echo "::group::$check"
            bun "$check"
            echo "::endgroup::"
            ran=$((ran + 1))
          done

          if (( ran == 0 )); then
            echo "Shard $shard did not receive any checks."
            exit 1
          fi
          echo "Shard $shard completed $ran checks."

  release-guard:
    name: release-guard
    if: always()
    needs:
      - build
      - typecheck
      - lint
      - game-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all release checks passed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          GAME_CHECKS_RESULT: ${{ needs.game-checks.result }}
        run: |
          set -euo pipefail
          printf 'build=%s\ntypecheck=%s\nlint=%s\ngame-checks=%s\n' \
            "$BUILD_RESULT" "$TYPECHECK_RESULT" "$LINT_RESULT" "$GAME_CHECKS_RESULT"

          for result in "$BUILD_RESULT" "$TYPECHECK_RESULT" "$LINT_RESULT" "$GAME_CHECKS_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Release guard failed because a required CI job did not succeed."
              exit 1
            fi
          done

          echo "All release checks passed."

