name: CI

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  game-checks:
    name: game-checks shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run game verification suites
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          checks=(src/lib/game/__checks__/*.check.ts)
          if [ ${#checks[@]} -eq 0 ]; then
            echo "No game verification suites found."
            exit 1
          fi

          shard=${{ matrix.shard }}
          shard_count=3
          ran=0
          for i in "${!checks[@]}"; do
            if (( i % shard_count != shard )); then
              continue
            fi
            check="${checks[$i]}"
            echo "::group::$check"
            bun "$check"
            echo "::endgroup::"
            ran=$((ran + 1))
          done

          if (( ran == 0 )); then
            echo "Shard $shard did not receive any checks."
            exit 1
          fi
          echo "Shard $shard completed $ran checks."
