name: CI

on:
  # Feature branches are validated by their pull request. Running the same
  # workflow again for the branch push duplicates the full simulation suite
  # and can cancel the PR run through the shared concurrency group.
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  game-checks:
    name: game-checks shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Shard 0 was cancelled at the 35-minute limit without a failed assertion.
    # Allow the complete suite to finish on shared runners while retaining
    # a bounded job timeout; every assertion and the release guard still apply.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run game verification suites
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          checks=(src/lib/game/__checks__/*.check.ts)
          if [ ${#checks[@]} -eq 0 ]; then
            echo "No game verification suites found."
            exit 1
          fi

          shard=${{ matrix.shard }}
          shard_count=4

          # Keep the known long-running suites on separate runners. Everything
          # else is distributed deterministically below, so adding ordinary
          # checks does not pile another heavyweight onto an already-hot shard.
          heavy_checks=(
            "src/lib/game/__checks__/history.check.ts"
            "src/lib/game/__checks__/pyramid-long-horizon.check.ts"
            "src/lib/game/__checks__/perf.check.ts"
            "src/lib/game/__checks__/season-balance.check.ts"
          )

          declare -A heavy_set=()
          for check in "${heavy_checks[@]}"; do
            if [[ ! -f "$check" ]]; then
              echo "Pinned heavyweight check is missing: $check"
              exit 1
            fi
            heavy_set["$check"]=1
          done

          assigned=()
          assigned+=("${heavy_checks[$shard]}")

          ordinary_index=0
          for check in "${checks[@]}"; do
            if [[ -n "${heavy_set[$check]:-}" ]]; then
              continue
            fi
            if (( ordinary_index % shard_count == shard )); then
              assigned+=("$check")
            fi
            ordinary_index=$((ordinary_index + 1))
          done

          if (( ${#assigned[@]} == 0 )); then
            echo "Shard $shard did not receive any checks."
            exit 1
          fi

          echo "Shard $shard received ${#assigned[@]} checks; heavyweight: ${heavy_checks[$shard]}"
          for check in "${assigned[@]}"; do
            echo "::group::$check"
            bun "$check"
            echo "::endgroup::"
          done

          echo "Shard $shard completed ${#assigned[@]} checks."

  release-guard:
    name: release-guard
    if: always()
    needs:
      - build
      - typecheck
      - lint
      - game-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all release checks passed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          GAME_CHECKS_RESULT: ${{ needs.game-checks.result }}
        run: |
          set -euo pipefail
          printf 'build=%s\ntypecheck=%s\nlint=%s\ngame-checks=%s\n' \
            "$BUILD_RESULT" "$TYPECHECK_RESULT" "$LINT_RESULT" "$GAME_CHECKS_RESULT"

          for result in "$BUILD_RESULT" "$TYPECHECK_RESULT" "$LINT_RESULT" "$GAME_CHECKS_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Release guard failed because a required CI job did not succeed."
              exit 1
            fi
          done

          echo "All release checks passed."
