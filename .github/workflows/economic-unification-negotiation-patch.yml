# Registered retry trigger
name: Migrate negotiation wage economy

on:
  push:
    branches:
      - 'chatgpt/economic-unification'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[negotiation-levels]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/economic-unification
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Move negotiation wages onto football levels
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/game/recruitment.ts')
          text = p.read_text()

          old = '''  recruitmentPlayerValue,
  recruitmentSustainableWageBill,
  recruitmentWageForClub,'''
          new = '''  recruitmentPlayerValue,
  recruitmentSustainableWageBill,
  recruitmentUserNegotiationWage,
  recruitmentWageForClub,'''
          if text.count(old) != 1:
            raise SystemExit(f'import anchor expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''  const growth = clubGrowthFactor(s);
  return Math.max(
    250,
    int(
      (p.wageExpectation * roleFactor * personality * facilityFactor * growth) / ambitionGap / 25,
    ) * 25,
  );'''
          new = '''  const growth = clubGrowthFactor(s);
  const rawDemand =
    (p.wageExpectation * roleFactor * personality * facilityFactor * growth) / ambitionGap;
  return recruitmentUserNegotiationWage(s, rawDemand);'''
          if text.count(old) != 1:
            raise SystemExit(f'wageDemand block expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''  const uplift = 1 + clamp((p.currentAbility - 55) / 120, 0, 0.5) + rngRange(rng, 0, 0.12);
  const wage = Math.max(c.weeklyWage, int((wageDemand(s, p, c.squadRole) * uplift) / 25) * 25);'''
          new = '''  const uplift = 1 + clamp((p.currentAbility - 55) / 120, 0, 0.5) + rngRange(rng, 0, 0.12);
  const wage = Math.max(
    c.weeklyWage,
    recruitmentUserNegotiationWage(s, wageDemand(s, p, c.squadRole) * uplift),
  );'''
          if text.count(old) != 1:
            raise SystemExit(f'renewal wage block expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          p.write_text(text)
      - name: Format and commit
        shell: bash
        run: |
          bunx prettier --write src/lib/game/recruitment.ts
          rm .github/workflows/economic-unification-negotiation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/lib/game/recruitment.ts .github/workflows/economic-unification-negotiation-patch.yml
          git commit -m "Move negotiation wages onto football levels [negotiation-levels]"
          git push origin HEAD:chatgpt/economic-unification
