name: Apply recruitment lifecycle economy migration patch

on:
  push:
    branches:
      - 'chatgpt/economic-unification'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[recruitment-lifecycle-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/economic-unification
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Move recruitment lifecycle onto football levels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/lib/game/recruitment.ts')
          text = p.read_text()

          def sub(pattern, repl, label, count=1):
            global text
            text, n = re.subn(pattern, repl, text, count=count, flags=re.MULTILINE)
            if n != count:
              raise SystemExit(f'{label}: expected {count}, found {n}')

          sub(
            r'(recruitmentContractWageForLevel,\n\s+recruitmentLevelOfClub,\n)',
            r'\1  recruitmentLevelOfUser,\n',
            'recruitmentLevelOfUser import',
          )
          sub(
            r'(recruitmentSustainableWageBill,\n)',
            r'\1  recruitmentWageForClub,\n',
            'recruitmentWageForClub import',
          )

          sub(
            r'  const rep = clubReputation\(s, c\.clubId\);\n  const tier = tierOfClub\(s, c\.clubId\);\n  const age = ageOf\(p, s\.season\);',
            '  const rep = clubReputation(s, c.clubId);\n  const age = ageOf(p, s.season);',
            'AI renewal setup',
          )
          sub(
            r'wageForAbility\(p\.currentAbility, rep, tier, age, p\.potentialAbility\),',
            'recruitmentWageForClub(s, c.clubId, p.currentAbility, age, p.potentialAbility),',
            'AI renewal wage',
          )

          sub(
            r'wageForAbility\(\s*pick\.currentAbility,\s*rep,\s*tierOfClub\(s, club\),\s*ageOf\(pick, s\.season\),\s*pick\.potentialAbility,\s*\),',
            'recruitmentWageForClub(\n        s,\n        club,\n        pick.currentAbility,\n        ageOf(pick, s.season),\n        pick.potentialAbility,\n      ),',
            'AI recruitment wage',
          )

          sub(
            r'  const rep = clubReputation\(s, s\.clubName\);\n  const tier = tierOfClub\(s, s\.clubName\);\n  const needed = Math\.min\(2, MIN_SQUAD_SIZE - squad\.length\);',
            '  const rep = clubReputation(s, s.clubName);\n  const tier = tierOfClub(s, s.clubName);\n  const level = recruitmentLevelOfUser(s);\n  const needed = Math.min(2, MIN_SQUAD_SIZE - squad.length);',
            'emergency cover setup',
          )
          sub(
            r'const ceiling = Math\.max\(600, sustainableWeeklyWageBill\(tier, rep\) - userWageBill\(s\)\);',
            'const ceiling = Math.max(\n      level <= 6 ? 600 : 25,\n      recruitmentSustainableWageBill(s, s.clubName) - userWageBill(s),\n    );',
            'emergency wage ceiling',
          )
          sub(
            r'wageForAbility\(p\.currentAbility, rep, tier, ageOf\(p, s\.season\), p\.potentialAbility\) <=\s*ceiling;',
            'recruitmentWageForClub(\n        s,\n        s.clubName,\n        p.currentAbility,\n        ageOf(p, s.season),\n        p.potentialAbility,\n      ) <= ceiling;',
            'emergency affordability',
          )
          sub(
            r'wageForAbility\(pick\.currentAbility, rep, tier, age, pick\.potentialAbility\),',
            'recruitmentWageForClub(s, s.clubName, pick.currentAbility, age, pick.potentialAbility),',
            'emergency signing wage',
          )

          sub(
            r'    const age = ageOf\(p, s\.season\);\n    const tier = p\.currentClubId \? tierOfClub\(s, p\.currentClubId\) : tierOfUser\(s\);\n    p\.marketValue = valueForPlayer\(p\.currentAbility, p\.potentialAbility, age, tier\);\n    p\.wageExpectation = wageForAbility\(\s*p\.currentAbility,\s*p\.currentClubId \? clubReputation\(s, p\.currentClubId\) : 45,\s*tier,\s*age,\s*p\.potentialAbility,\s*\);',
            '    const age = ageOf(p, s.season);\n    const level = p.currentClubId\n      ? recruitmentLevelOfClub(s, p.currentClubId)\n      : recruitmentLevelOfUser(s);\n    p.marketValue = recruitmentPlayerValue(p.currentAbility, p.potentialAbility, age, level);\n    p.wageExpectation = p.currentClubId\n      ? recruitmentWageForClub(s, p.currentClubId, p.currentAbility, age, p.potentialAbility)\n      : recruitmentWageForLevel(level, p.currentAbility, 45, age, p.potentialAbility);',
            'season rollover economy',
          )

          sub(
            r'    const buyerRep = clubReputation\(s, n\.toClubId\);\n',
            '',
            'outgoing buyer rep cleanup',
          )
          sub(
            r'wageForAbility\(\s*p\.currentAbility,\s*buyerRep,\s*tierOfClub\(s, n\.toClubId\),\s*ageOf\(p, s\.season\),\s*p\.potentialAbility,\s*\),',
            'recruitmentWageForClub(\n        s,\n        n.toClubId,\n        p.currentAbility,\n        ageOf(p, s.season),\n        p.potentialAbility,\n      ),',
            'outgoing buyer wage',
          )

          if 'sustainableWeeklyWageBill(' not in text:
            text = text.replace(
              'import { tierOfClub, tierOfUser, sustainableWeeklyWageBill } from "./economy";',
              'import { tierOfClub, tierOfUser } from "./economy";',
            )

          p.write_text(text)
          PY
          bunx prettier --write src/lib/game/recruitment.ts
      - name: Commit lifecycle migration patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/lib/game/recruitment.ts
          git commit -m "Move recruitment lifecycle onto football levels [recruitment-lifecycle-patched]"
          git push origin HEAD:chatgpt/economic-unification
