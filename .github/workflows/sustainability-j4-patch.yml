name: Patch stale passive sustainability scenario

on:
  push:
    branches:
      - 'chatgpt/persistent-world-foundation'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sustainability-j4-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/persistent-world-foundation
      - name: Replace stale passive cash-hoarding assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/game/__checks__/sustainability.check.ts')
          text = p.read_text()
          label = '"J4. hoarding cash while neglecting the club creates pressure"'
          j5 = '"J5. pressure gives way once surplus reserves are gone"'
          label_at = text.find(label)
          if label_at < 0:
              raise SystemExit('J4 label not found')
          start = text.rfind('  check(', 0, label_at)
          j5_at = text.find(j5, label_at)
          end = text.rfind('  check(', label_at, j5_at)
          if start < 0 or j5_at < 0 or end <= start:
              raise SystemExit(f'could not isolate J4 block: start={start} j5={j5_at} end={end}')
          replacement = '''  const cashRichNeglected = clone(s);\n  cashRichNeglected.cash = recommendedReserve(cashRichNeglected) * 6;\n  for (const asset of cashRichNeglected.infrastructure?.assets ?? []) {\n    asset.condition = 6;\n    asset.qualityRating = 6;\n  }\n  cashRichNeglected.fanHappiness = 12;\n  cashRichNeglected.sustainability!.excessWeeks = 60;\n  const cashRichPressure = reinvestmentPressure(cashRichNeglected);\n  check(\n    "J4. hoarding genuine surplus cash while neglecting the club creates pressure",\n    cashRichPressure.score > 0 &&\n      cashRichNeglected.cash > recommendedReserve(cashRichNeglected) &&\n      cashRichPressure.need > 0.2,\n    `pressure=${cashRichPressure.score} cash=${cashRichNeglected.cash} reserve=${recommendedReserve(cashRichNeglected)} need=${cashRichPressure.need}`,\n  );\n'''
          p.write_text(text[:start] + replacement + text[end:])
          PY
          bunx prettier --write src/lib/game/__checks__/sustainability.check.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/game/__checks__/sustainability.check.ts
          git commit -m "Exercise sustainability pressure with real surplus cash [sustainability-j4-patched]"
          git push origin HEAD:chatgpt/persistent-world-foundation
