name: Patch stale passive sustainability scenario

on:
  push:
    branches:
      - 'chatgpt/persistent-world-foundation'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sustainability-j4-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/persistent-world-foundation
      - name: Replace stale passive cash-hoarding assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/lib/game/__checks__/sustainability.check.ts')
          text = p.read_text()
          pattern = re.compile(r'''  check\(\n\s*"J4\. hoarding cash while neglecting the club creates pressure",\n.*?\n\s*\);''', re.S)
          replacement = '''  const cashRichNeglected = clone(s);\n  cashRichNeglected.cash = recommendedReserve(cashRichNeglected) * 6;\n  for (const asset of cashRichNeglected.infrastructure?.assets ?? []) {\n    asset.condition = 6;\n    asset.qualityRating = 6;\n  }\n  cashRichNeglected.fanHappiness = 12;\n  cashRichNeglected.sustainability!.excessWeeks = 60;\n  const cashRichPressure = reinvestmentPressure(cashRichNeglected);\n  check(\n    "J4. hoarding genuine surplus cash while neglecting the club creates pressure",\n    cashRichPressure.score > 0 &&\n      cashRichNeglected.cash > recommendedReserve(cashRichNeglected) &&\n      cashRichPressure.need > 0.2,\n    `pressure=${cashRichPressure.score} cash=${cashRichNeglected.cash} reserve=${recommendedReserve(cashRichNeglected)} need=${cashRichPressure.need}`,\n  );'''
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one J4 block, found {count}; refusing broad edit')
          p.write_text(text2)
          PY
          bunx prettier --write src/lib/game/__checks__/sustainability.check.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/game/__checks__/sustainability.check.ts
          git commit -m "Exercise sustainability pressure with real surplus cash [sustainability-j4-patched]"
          git push origin HEAD:chatgpt/persistent-world-foundation
